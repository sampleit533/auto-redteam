name: RedTeam — Foothold Run (scenario ON a real EC2, via SSM)

# Runs ONE scenario (T2 IAM privesc or T4 S3 bulk read) on the compromised-EC2
# foothold instead of on the CI runner. The scenario code is identical to the
# OIDC path; the difference is WHERE it runs: on the EC2 (its instance profile),
# so CloudTrail attributes the activity to the workload's role + the EC2 IP.
#
# Authorization gate ("only a valid actor may push a scenario to AWS"):
#   1. actor allowlist preflight  (vars.FOOTHOLD_ALLOWED_ACTORS)
#   2. GitHub Environment aws-sandbox with Required reviewers (manual approval)
#   3. OIDC trust is scoped to repo:...:environment:aws-sandbox (see main.tf),
#      so a job WITHOUT this environment cannot obtain AWS credentials at all.
#
# Prereqs (one-time): terraform apply in infra/aws-bootstrap creates the EC2,
# the code bucket and the SSM-drive permissions. Then set repo variables:
#   FOOTHOLD_INSTANCE_ID   (terraform output foothold_instance_id)
#   FOOTHOLD_CODE_BUCKET   (terraform output foothold_code_bucket)
#   FOOTHOLD_ALLOWED_ACTORS (comma-separated GitHub logins; e.g. sampleit533)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run on the foothold'
        required: true
        type: choice
        default: t2_privilege_escalation
        options:
          - t2_privilege_escalation
          - t4_data_exfiltration
          - cloud            # t8 recon -> t2 -> t4 (all on the EC2)
      approval_ticket:
        description: 'Approval ticket ID (required)'
        required: true
        type: string
      cloudtrail_timeout:
        description: 'Max seconds to wait for CloudTrail (latency ~5-15 min)'
        required: false
        type: string
        default: '900'

permissions:
  id-token: write
  contents: read

# One real-cloud run at a time (cost + IAM name clashes + single EC2).
concurrency:
  group: redteam-foothold-run
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::406953137587:role/redteam-deploy' }}
  FOOTHOLD_INSTANCE_ID: ${{ vars.FOOTHOLD_INSTANCE_ID }}
  FOOTHOLD_CODE_BUCKET: ${{ vars.FOOTHOLD_CODE_BUCKET }}

jobs:
  preflight:
    name: Preflight — actor allowlist + approval ticket
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and actor
        env:
          ALLOWED: ${{ vars.FOOTHOLD_ALLOWED_ACTORS || 'sampleit533' }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${{ inputs.approval_ticket }}" ]; then
            echo "::error::No approval ticket provided."; exit 1
          fi
          if [ -z "${FOOTHOLD_INSTANCE_ID}" ] || [ -z "${FOOTHOLD_CODE_BUCKET}" ]; then
            echo "::error::Set repo variables FOOTHOLD_INSTANCE_ID and FOOTHOLD_CODE_BUCKET (terraform outputs)."; exit 1
          fi
          ok=0
          IFS=','; for a in $ALLOWED; do
            a="$(echo "$a" | xargs)"            # trim spaces
            [ "$a" = "$ACTOR" ] && ok=1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Actor '$ACTOR' is not in the allowlist ($ALLOWED)."; exit 1
          fi
          echo "Actor $ACTOR authorized. Ticket: ${{ inputs.approval_ticket }}. Scenario: ${{ inputs.scenario }}."

  run:
    name: Run ${{ inputs.scenario }} on the foothold (real AWS via SSM)
    runs-on: ubuntu-latest
    needs: preflight
    # Required reviewers on this environment = the manual approval gate. The
    # OIDC trust is scoped to this environment, so creds are unobtainable
    # without it (defense in depth with the allowlist above).
    environment: aws-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: redteam-foothold-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Sync runner code to the private code bucket
        run: |
          aws s3 sync . "s3://${FOOTHOLD_CODE_BUCKET}/repo" \
            --delete \
            --exclude '.git/*' \
            --exclude 'artifacts/*' \
            --exclude '*.pptx' \
            --exclude '*.drawio'

      - name: Wake the foothold + wait for SSM
        id: wake
        run: |
          ID="${FOOTHOLD_INSTANCE_ID}"
          aws ec2 start-instances --instance-ids "$ID" >/dev/null || true
          aws ec2 wait instance-running --instance-ids "$ID"
          echo "Instance running; waiting for SSM agent to register..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                     --filters "Key=InstanceIds,Values=$ID" \
                     --query 'InstanceInformationList[0].PingStatus' \
                     --output text 2>/dev/null || echo None)
            if [ "$PING" = "Online" ]; then echo "SSM Online."; break; fi
            sleep 10
          done
          if [ "$PING" != "Online" ]; then
            echo "::error::SSM agent did not come Online in time."; exit 1
          fi

      - name: Send scenario command over SSM
        id: send
        run: |
          ID="${FOOTHOLD_INSTANCE_ID}"
          RUNID="${{ github.run_id }}"
          CMD="REDTEAM_CLOUDTRAIL_TIMEOUT=${{ inputs.cloudtrail_timeout }} REDTEAM_CLOUDTRAIL_INTERVAL=30 /opt/redteam/run-scenario.sh ${{ inputs.scenario }} ${RUNID}"
          cat > /tmp/params.json <<EOF
          {"commands": ["$CMD"]}
          EOF
          CID=$(aws ssm send-command \
                  --instance-ids "$ID" \
                  --document-name "AWS-RunShellScript" \
                  --comment "auto-redteam foothold ${{ inputs.scenario }} run ${RUNID}" \
                  --timeout-seconds 600 \
                  --parameters file:///tmp/params.json \
                  --query 'Command.CommandId' --output text)
          echo "command_id=$CID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $CID"

      - name: Poll for completion + stream output
        run: |
          ID="${FOOTHOLD_INSTANCE_ID}"
          CID="${{ steps.send.outputs.command_id }}"
          STATUS=Pending
          for i in $(seq 1 40); do            # up to ~20 min (CloudTrail latency)
            sleep 30
            STATUS=$(aws ssm get-command-invocation \
                       --command-id "$CID" --instance-id "$ID" \
                       --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          echo "----- STDOUT -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text || true
          echo "----- STDERR -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$ID" \
            --query 'StandardErrorContent' --output text || true
          echo "FINAL_STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Pull results from the code bucket
        if: always()
        run: |
          mkdir -p artifacts
          aws s3 cp "s3://${FOOTHOLD_CODE_BUCKET}/artifacts/${{ github.run_id }}/results.json" \
            artifacts/results.json || echo "No results.json produced."

      - name: Evaluate detections (real CloudTrail observables)
        if: always()
        run: |
          if [ -f artifacts/results.json ]; then
            python evaluation/evaluate_results.py \
              --results artifacts/results.json \
              --mappings evaluation/expected_mappings.yaml \
              --out artifacts/evaluation.json || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-foothold-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Fail the job if the scenario did not succeed
        run: |
          echo "Foothold command final status: ${FINAL_STATUS:-unknown}"
          [ "${FINAL_STATUS:-}" = "Success" ]

  summary:
    name: Post summary
    runs-on: ubuntu-latest
    needs: run
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## RedTeam Foothold Run"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Run ID | ${{ github.run_id }} |"
            echo "| Scenario | ${{ inputs.scenario }} |"
            echo "| Executed on | EC2 foothold (instance-profile creds), NOT the CI runner |"
            echo "| Attribution | CloudTrail userIdentity = redteam-ec2-foothold role; sourceIP = EC2 |"
            echo "| Auth | GitHub OIDC -> redteam-deploy -> SSM SendCommand (no static keys) |"
            echo "| Approval Ticket | ${{ inputs.approval_ticket }} |"
            echo "| Triggered by | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

name: RedTeam — On-Demand

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run'
        required: true
        type: choice
        options:
          - t1_bruteforce_ssh
          - t2_privilege_escalation
          - t3_lateral_movement
          - t4_data_exfiltration
          - t5_ci_compromise
          - t6_network_recon
          - t7_log4shell_probe
          - all
        default: t1_bruteforce_ssh
      approval_ticket:
        description: 'Approval ticket ID (required)'
        required: true
        type: string
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - safe
          - dry-run
        default: dry-run

env:
  ELASTICSEARCH_HOST: http://localhost:9200
  IAM_ENDPOINT: http://localhost:4566

jobs:
  preflight:
    name: Preflight — Validate approval
    runs-on: ubuntu-latest
    steps:
      - name: Check approval ticket
        run: |
          if [ -z "${{ github.event.inputs.approval_ticket }}" ]; then
            echo "ERROR: No approval ticket provided. Aborting."
            exit 1
          fi
          echo "Approval ticket: ${{ github.event.inputs.approval_ticket }}"
          echo "Scenario: ${{ github.event.inputs.scenario }}"
          echo "Mode: ${{ github.event.inputs.mode }}"
          echo "Triggered by: ${{ github.actor }}"

  simulate:
    name: Run simulation
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner dependencies
        run: pip install -r runners/requirements.txt

      - name: Start sandbox SSH target (T1)
        run: |
          # Install and configure OpenSSH server directly on the runner
          sudo apt-get install -y openssh-server
          # Create test account
          sudo useradd -m -s /bin/bash redteam-test || true
          echo "redteam-test:${REDTEAM_SSH_TEST_PASSWORD:-RedteamPass123!}" | sudo chpasswd
          # Allow password authentication on port 2222
          sudo mkdir -p /run/sshd
          echo "Port 2222" | sudo tee /etc/ssh/sshd_config.d/redteam.conf
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config.d/redteam.conf
          echo "MaxAuthTries 100" | sudo tee -a /etc/ssh/sshd_config.d/redteam.conf
          # Start sshd
          sudo /usr/sbin/sshd
          # Wait until port is ready
          timeout 15 bash -c 'until nc -z 127.0.0.1 2222; do sleep 1; done' && echo "SSH ready on port 2222"

      - name: Start sandbox cloud target (T2/T4 — IAM + S3)
        run: |
          docker run -d --name localstack \
            -p 127.0.0.1:4566:4566 \
            -e SERVICES=iam,sts,cloudtrail,s3 \
            -e EAGER_SERVICE_LOADING=1 \
            localstack/localstack:3
          timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health | grep -q running; do sleep 2; done' && echo "LocalStack ready" || echo "WARNING: LocalStack not ready"

      - name: Start lateral-move/recon targets (T3, T6)
        run: |
          docker run -d --name target-web -p 127.0.0.1:8080:80 nginx:alpine
          docker run -d --name target-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          timeout 30 bash -c 'until nc -z 127.0.0.1 8080; do sleep 1; done' && echo "target-web ready" || echo "WARNING: target-web not ready"
          timeout 30 bash -c 'until nc -z 127.0.0.1 6379; do sleep 1; done' && echo "target-redis ready" || echo "WARNING: target-redis not ready"

      - name: Build pcap recorder image (T3/T6/T7)
        run: |
          docker build -q -t redteam/pcap-recorder:latest targets/pcap-recorder/

      - name: Build Snort 3 replay image (T7)
        run: |
          docker build -q -t redteam/snort-runner:latest targets/snort-runner/

      - name: Run simulation
        env:
          REDTEAM_SSH_TEST_PASSWORD: ${{ secrets.REDTEAM_SSH_TEST_PASSWORD || 'RedteamPass123!' }}
          TARGET_SSH_HOST: localhost
          TARGET_USE_LOCALHOST: "1"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          REDTEAM_IAM_PRINCIPAL: github-actions-${{ github.run_id }}
          REDTEAM_CI_ACTOR: github-actions-${{ github.run_id }}
          ENABLE_PCAP: "1"
        run: |
          python runners/simulate.py \
            --scenario ${{ github.event.inputs.scenario }} \
            --mode ${{ github.event.inputs.mode }} \
            --run-id ${{ github.run_id }} \
            --output artifacts/results.json

      - name: Evaluate detections
        if: always()
        run: |
          python evaluation/evaluate_results.py \
            --results artifacts/results.json \
            --mappings evaluation/expected_mappings.yaml \
            --out artifacts/evaluation.json

      - name: Generate report
        if: always()
        run: |
          if [ ! -f artifacts/evaluation.json ]; then
            python reporting/make_eval_stub.py
          fi
          python reporting/generate_report.py \
            --evaluation artifacts/evaluation.json \
            --template reporting/templates/report.html.j2 \
            --out artifacts/report.html || true
          python reporting/generate_trends.py \
            --history artifacts/history \
            --template reporting/templates/trends.html.j2 \
            --out artifacts/trends.html || true

      - name: Baseline regression gate
        if: github.event.inputs.scenario == 'all'
        run: |
          python evaluation/check_baseline.py \
            --baseline evaluation/baseline.json \
            --current artifacts/evaluation.json

      - name: Export Sigma rules
        if: always()
        run: |
          python evaluation/export_sigma.py --out-dir artifacts/sigma

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Teardown sandbox
        if: always()
        run: |
          sudo pkill sshd || true
          docker rm -f localstack target-web target-redis || true

  summary:
    name: Post summary
    runs-on: ubuntu-latest
    needs: simulate
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## RedTeam Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario | ${{ github.event.inputs.scenario }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ github.event.inputs.mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Approval Ticket | ${{ github.event.inputs.approval_ticket }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

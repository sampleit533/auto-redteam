name: RedTeam — Scheduled Baseline

on:
  schedule:
    # Every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: false
        type: choice
        options:
          - safe
          - dry-run
        default: safe

env:
  ELASTICSEARCH_HOST: http://localhost:9200
  IAM_ENDPOINT: http://localhost:4566

jobs:
  nightly-baseline:
    name: Nightly baseline — all scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner dependencies
        run: pip install -r runners/requirements.txt

      - name: Start SSH target (native on runner)
        env:
          REDTEAM_SSH_TEST_PASSWORD: ${{ secrets.REDTEAM_SSH_TEST_PASSWORD || 'RedteamPass123!' }}
        run: |
          # Install and configure OpenSSH server directly on the runner
          sudo apt-get update && sudo apt-get install -y openssh-server
          # Create test account
          sudo useradd -m -s /bin/bash redteam-test || true
          echo "redteam-test:${REDTEAM_SSH_TEST_PASSWORD}" | sudo chpasswd
          # Configure sshd for brute-force simulation
          sudo mkdir -p /run/sshd
          sudo tee /etc/ssh/sshd_config.d/redteam.conf > /dev/null <<EOF
          Port 2222
          PasswordAuthentication yes
          MaxAuthTries 100
          MaxStartups 100:30:200
          LoginGraceTime 120
          EOF
          # Start sshd
          sudo /usr/sbin/sshd
          # Wait until port is ready
          timeout 15 bash -c 'until nc -z 127.0.0.1 2222; do sleep 1; done'
          echo "SSH ready on port 2222"

      - name: Start LocalStack (T2/T4 target — IAM + S3)
        run: |
          docker run -d --name localstack \
            -p 127.0.0.1:4566:4566 \
            -e SERVICES=iam,sts,cloudtrail,s3 \
            -e EAGER_SERVICE_LOADING=1 \
            localstack/localstack:3
          echo "Waiting for LocalStack to be ready..."
          for i in {1..40}; do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; then
              echo "LocalStack ready after ~$((i*3))s"
              break
            fi
            echo "Attempt $i/40: LocalStack not ready yet..."
            sleep 3
          done
          # Final check
          curl -sf http://localhost:4566/_localstack/health || { echo "LocalStack failed to start"; docker logs localstack; exit 1; }

      - name: Start lateral-move/recon targets (T3, T6)
        run: |
          docker run -d --name target-web -p 127.0.0.1:8080:80 nginx:alpine
          docker run -d --name target-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          timeout 30 bash -c 'until nc -z 127.0.0.1 8080; do sleep 1; done' && echo "target-web ready"
          timeout 30 bash -c 'until nc -z 127.0.0.1 6379; do sleep 1; done' && echo "target-redis ready"

      - name: Build pcap recorder image (T3/T6/T7)
        run: |
          docker build -q -t redteam/pcap-recorder:latest targets/pcap-recorder/

      - name: Build Snort 3 replay image (T7)
        run: |
          docker build -q -t redteam/snort-runner:latest targets/snort-runner/

      - name: Run all scenarios
        env:
          REDTEAM_SSH_TEST_PASSWORD: ${{ secrets.REDTEAM_SSH_TEST_PASSWORD }}
          TARGET_SSH_HOST: localhost
          TARGET_USE_LOCALHOST: "1"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          REDTEAM_IAM_PRINCIPAL: github-actions-${{ github.run_id }}
          REDTEAM_CI_ACTOR: github-actions-${{ github.run_id }}
          ENABLE_PCAP: "1"
        run: |
          MODE="${{ github.event.inputs.mode || 'safe' }}"
          python runners/simulate.py \
            --scenario all \
            --mode $MODE \
            --run-id ${{ github.run_id }} \
            --output artifacts/results.json

      - name: Evaluate detections
        run: |
          python evaluation/evaluate_results.py \
            --results artifacts/results.json \
            --mappings evaluation/expected_mappings.yaml \
            --out artifacts/evaluation.json

      - name: Generate report
        if: always()
        run: |
          if [ ! -f artifacts/evaluation.json ]; then
            python reporting/make_eval_stub.py
          fi
          python reporting/generate_report.py \
            --evaluation artifacts/evaluation.json \
            --template reporting/templates/report.html.j2 \
            --out artifacts/report.html || true
          python reporting/generate_trends.py \
            --history artifacts/history \
            --template reporting/templates/trends.html.j2 \
            --out artifacts/trends.html || true

      - name: Baseline regression gate (fails build on detection regression)
        run: |
          python evaluation/check_baseline.py \
            --baseline evaluation/baseline.json \
            --current artifacts/evaluation.json

      - name: Export Sigma rules
        if: always()
        run: |
          python evaluation/export_sigma.py --out-dir artifacts/sigma

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report-${{ github.run_id }}
          path: artifacts/
          retention-days: 90

      - name: Teardown sandbox
        if: always()
        run: |
          sudo pkill sshd || true
          docker rm -f localstack target-web target-redis || true

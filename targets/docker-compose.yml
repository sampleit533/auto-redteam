version: "3.9"

# Sandbox target workloads for red team simulations
# Bring up: docker compose up -d
# Tear down: docker compose down -v

networks:
  # Internal network for container-to-container traffic (no internet)
  redteam-internal:
    driver: bridge
    internal: true
  # Host-accessible network for simulation runners to connect
  redteam-host:
    driver: bridge

services:

  # T1 target — SSH server with test account (custom image)
  target-ssh:
    build:
      context: ./ssh-target
      args:
        SSH_USER: redteam-test
        SSH_PASSWORD: ${REDTEAM_SSH_TEST_PASSWORD:-RedteamPass123!}
    container_name: target-ssh
    networks:
      - redteam-internal
      - redteam-host
    ports:
      - "127.0.0.1:2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # T2/T4 target — LocalStack (mock AWS IAM + CloudTrail + S3)
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    networks:
      - redteam-internal
      - redteam-host
    environment:
      - SERVICES=iam,sts,cloudtrail,s3
      - DEBUG=0
      - PERSISTENCE=0
      - EAGER_SERVICE_LOADING=1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # T3/T6 target — lightweight HTTP service for lateral-move and recon probes
  target-web:
    image: nginx:alpine
    container_name: target-web
    networks:
      - redteam-internal
      - redteam-host
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # T3/T6 target — lightweight Redis service for lateral-move and recon probes
  target-redis:
    image: redis:7-alpine
    container_name: target-redis
    networks:
      - redteam-internal
      - redteam-host
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Filebeat — ships logs to Elasticsearch (optional, only internal network needed)
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    networks:
      - redteam-internal
    volumes:
      - ../collection/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - target-ssh
      - localstack

volumes:
  localstack-data:

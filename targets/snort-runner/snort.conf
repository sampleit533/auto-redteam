# Minimal Snort 2.9 config for OFFLINE pcap replay.
# We deliberately disable every preprocessor and decoder alert — we only
# care about the content-match rules in log4shell.rules.

ipvar HOME_NET any
ipvar EXTERNAL_NET any

config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_tcpopt_alerts
config disable_ipopt_alerts
config disable_decode_drops

# Only our custom rules — no community rule packs needed.
include /etc/snort/rules/log4shell.rules

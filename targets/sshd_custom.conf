# Custom SSH config for red team brute-force simulation
# Allows high number of concurrent unauthenticated connections

# MaxStartups: start:rate:full
# - Allow 100 unauthenticated connections before rate limiting
# - After 100, drop 30% of new connections
# - Hard limit at 200 connections
MaxStartups 100:30:200

# Allow up to 100 auth attempts per connection
MaxAuthTries 100

# Increase login grace time (seconds to authenticate)
LoginGraceTime 120
